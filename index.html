<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>TGFLIX - Live Sports</title>

<style>
:root{
    --netflix-red:#E50914;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    color:#fff;
}

/* PLAYER */
.player-container{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    background:#000;

    /* MOBILE FIX */
    position:absolute;
    top:0;
    left:0;

    transform:translateZ(0);
    -webkit-transform:translateZ(0);

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    will-change:transform;
}

/* HEADER */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:999;

    padding:20px 4%;

    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.9),
        transparent
    );

    display:flex;
    align-items:center;

    opacity:0;
    transition:0.3s;
    pointer-events:none;
}

.logo{
    color:var(--netflix-red);
    text-decoration:none;
    font-size:30px;
    font-weight:bold;
    letter-spacing:-1px;
    pointer-events:auto;
}

/* INFO */
.info{
    position:absolute;
    left:4%;
    bottom:60px;
    z-index:100;

    opacity:0;
    transform:translateY(20px);
    transition:0.3s;

    text-shadow:0 2px 10px rgba(0,0,0,0.8);
}

.title{
    font-size:clamp(2rem,7vw,4rem);
    font-weight:700;
    margin-bottom:10px;
}

.meta{
    font-size:1rem;
    color:#ddd;
}

.badge{
    border:1px solid #fff;
    padding:2px 7px;
    margin-right:10px;
    font-size:.8rem;
}

/* SHOW UI */
body.show-ui .header,
body.show-ui .info{
    opacity:1;
    transform:translateY(0);
}

/* MOBILE SAFE AREA */
@supports (padding:max(0px)){

    .header{
        padding-top:max(20px, env(safe-area-inset-top));
    }

    .info{
        bottom:max(60px, env(safe-area-inset-bottom));
    }
}

/* LOADER */
.loader{
    position:fixed;
    inset:0;
    z-index:2000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;
    color:#fff;
    font-size:18px;
}

.loader.hide{
    display:none;
}
</style>
</head>

<body class="show-ui">

<div class="loader" id="loader">
    Loading Stream...
</div>

<!-- HEADER -->
<div class="header">
    <a href="https://tgflix.lovable.app/" class="logo">
        TGFLIX
    </a>
</div>

<!-- PLAYER -->
<div class="player-container">

    <iframe
        id="player"

        src="https://sportseera2.pages.dev/Drm/P3?id=kayo"

        allow="
        autoplay;
        encrypted-media;
        fullscreen;
        picture-in-picture"

        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen

        referrerpolicy="no-referrer"
        loading="eager">
    </iframe>

    <!-- INFO -->
    <div class="info">
        <h1 class="title">
            Live Sports
        </h1>

        <div class="meta">
            <span class="badge">1080P</span>
            <span>2026</span> |
            <span>GT VS CSK</span>
        </div>
    </div>

</div>

<script>
const body = document.body;
const iframe = document.getElementById("player");
const loader = document.getElementById("loader");

let timeout;

/* SHOW/HIDE UI */
function showUI(){

    body.classList.add("show-ui");

    clearTimeout(timeout);

    timeout = setTimeout(() => {
        body.classList.remove("show-ui");
    },3000);
}

/* EVENTS */
[
    "mousemove",
    "touchstart",
    "touchmove",
    "click",
    "keydown"
].forEach(event => {
    document.addEventListener(event, showUI, {
        passive:true
    });
});

/* INITIAL */
showUI();

/* HIDE LOADER */
iframe.onload = () => {

    setTimeout(() => {
        loader.classList.add("hide");
    },1000);

};

/* MOBILE BLACK SCREEN FIX */
window.addEventListener("load", () => {

    setTimeout(() => {

        iframe.style.display = "none";

        requestAnimationFrame(() => {

            iframe.style.display = "block";

        });

    },500);

});

/* ANDROID + iOS RESIZE FIX */
function resizeFix(){

    document.documentElement.style.height =
        window.innerHeight + "px";

    document.body.style.height =
        window.innerHeight + "px";

}

window.addEventListener("resize", resizeFix);
window.addEventListener("orientationchange", resizeFix);

resizeFix();

/* EXTRA SAFARI FIX */
document.addEventListener("visibilitychange", () => {

    if(!document.hidden){

        iframe.src = iframe.src;

    }

});
</script>

</body>
</html>
