<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TGFLIX</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

<style>

:root{
    --red:#E50914;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Roboto',sans-serif;
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;

    z-index:9999;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 20px;

    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(10px);
}

.logo{
    color:var(--red);
    font-size:2.5rem;
    font-weight:900;
    text-decoration:none;
}

/* ================= BUTTONS ================= */

.player-controls{
    display:flex;
    gap:12px;
}

.btn-switch{
    border:none;
    padding:12px 22px;
    border-radius:12px;

    background:rgba(255,255,255,0.12);

    color:#fff;
    font-size:16px;
    font-weight:700;

    cursor:pointer;
    transition:0.25s;
}

.btn-switch.active{
    background:var(--red);
}

/* ================= MAIN ================= */

#main-container{
    width:100%;
    height:100%;
    position:relative;
}

/* ================= PLAYERS ================= */

.player-box{
    position:absolute;

    top:80px;
    left:0;

    width:100%;
    height:calc(100vh - 80px);

    background:#000;
}

/* ================= PLAYER ================= */

.player2-frame{
    width:100%;
    height:100%;
    border:none;
}

/* hidden player */
.hidden{
    opacity:0;
    pointer-events:none;
    z-index:-1;
}

/* active player */
.active{
    opacity:1;
    pointer-events:auto;
    z-index:1;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    header{
        height:auto;
        padding:12px;
        flex-direction:column;
        gap:10px;
    }

    .logo{
        font-size:2rem;
    }

    .btn-switch{
        font-size:14px;
        padding:10px 16px;
    }

    .player-box{
        top:120px;
        height:calc(100vh - 120px);
    }
}

</style>
</head>

<body>

<header>

    <a href="https://tgflix.lovable.app/" target="_blank" class="logo">TGFLIX</a>

    <div class="player-controls">

        <button
            id="btn1"
            class="btn-switch"
            onclick="goAdFree()">
            Kayo Ad Free
        </button>

        <button
            id="btn2"
            class="btn-switch active"
            onclick="switchPlayer(2)">
            Hindi HD
        </button>

    </div>

</header>

<div id="main-container">

    <!-- PLAYER -->

    <div id="player2" class="player-box active">

        <iframe
            id="iframe2"
            class="player2-frame"
            frameborder="0"
            allow="autoplay; encrypted-media; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

</div>

<script>

const iframe2 = document.getElementById("iframe2");

const player2URL =
"https://sportseera1.pages.dev/star?id=sidhu";

/* Default load Hindi HD */
iframe2.src = player2URL;

function goAdFree(){
    window.location.href = "https://tgipl.my.to/";
}

function switchPlayer(player){

    if(player === 2){

        document.getElementById("btn1").classList.remove("active");
        document.getElementById("btn2").classList.add("active");

        iframe2.src = player2URL + "&t=" + Date.now();
    }
}

</script>

</body>
</html>
