<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>TGFLIX - Live Sports</title>

<style>

:root{
    --red:#E50914;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    color:#fff;
}

/* PLAYER */

.player{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

iframe{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border:none;
    background:#000;

    z-index:1;

    transform:translateZ(0);
    -webkit-transform:translateZ(0);

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

/* TOP HEADER */

.header{
    position:fixed;
    top:0;
    left:0;

    width:100%;

    padding:20px 4%;

    z-index:9999;

    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.95),
        transparent
    );

    display:flex;
    align-items:center;

    opacity:0;
    transition:.3s;
}

.logo{
    color:var(--red);
    text-decoration:none;
    font-size:30px;
    font-weight:bold;
}

/* INFO */

.info{
    position:fixed;
    left:4%;
    bottom:50px;

    z-index:9999;

    opacity:0;

    transform:translateY(20px);

    transition:.3s;

    text-shadow:0 2px 10px rgba(0,0,0,0.8);
}

.title{
    font-size:clamp(2rem,7vw,4rem);
    font-weight:bold;
    margin-bottom:10px;
}

.meta{
    font-size:15px;
    color:#ddd;
}

.badge{
    border:1px solid #fff;
    padding:2px 8px;
    margin-right:10px;
}

/* SHOW UI */

body.show-ui .header,
body.show-ui .info{
    opacity:1;
    transform:translateY(0);
}

/* LOADER */

.loader{
    position:fixed;
    inset:0;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:99999;

    font-size:18px;
}

.loader.hide{
    display:none;
}

/* TAP BLOCKER */

.tap-layer{
    position:fixed;
    inset:0;

    z-index:10;

    background:transparent;
}

/* PLAY BUTTON */

.play-btn{
    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:20;

    border:none;
    outline:none;

    background:var(--red);
    color:#fff;

    padding:16px 40px;

    border-radius:8px;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;
}

/* SAFE AREA */

@supports (padding:max(0px)){

    .header{
        padding-top:max(20px, env(safe-area-inset-top));
    }

    .info{
        bottom:max(50px, env(safe-area-inset-bottom));
    }

}

</style>
</head>

<body class="show-ui">

<!-- LOADER -->

<div class="loader" id="loader">
    Loading Stream...
</div>

<!-- HEADER -->

<div class="header">

    <a
    href="https://tgflix.lovable.app/"
    class="logo">
        TGFLIX
    </a>

</div>

<!-- PLAYER -->

<div class="player">

    <iframe

        id="frame"

        src="https://sportseera2.pages.dev/Drm/P3?id=kayo"

        allow="
        autoplay;
        encrypted-media;
        fullscreen;
        picture-in-picture"

        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen

        referrerpolicy="no-referrer"

        scrolling="no">

    </iframe>

</div>

<!-- TAP BLOCKER -->

<div class="tap-layer" id="tapLayer"></div>

<!-- PLAY BUTTON -->

<button class="play-btn" id="playBtn">
    PLAY
</button>

<!-- INFO -->

<div class="info">

    <div class="title">
        Live Sports
    </div>

    <div class="meta">

        <span class="badge">1080P</span>

        GT VS CSK

    </div>
<br><br>
</div>

<script>

const body = document.body;

const loader = document.getElementById("loader");

const frame = document.getElementById("frame");

const playBtn = document.getElementById("playBtn");

const tapLayer = document.getElementById("tapLayer");

let timeout;

/* SHOW UI */

function showUI(){

    body.classList.add("show-ui");

    clearTimeout(timeout);

    timeout = setTimeout(() => {

        body.classList.remove("show-ui");

    },3000);

}

[
    "mousemove",
    "touchstart",
    "touchmove",
    "click",
    "keydown"
].forEach(event => {

    document.addEventListener(
        event,
        showUI,
        { passive:true }
    );

});

showUI();

/* PLAY BUTTON */

playBtn.onclick = () => {

    playBtn.remove();

    tapLayer.remove();

};

/* LOADER */

frame.onload = () => {

    setTimeout(() => {

        loader.classList.add("hide");

    },1500);

};

/* HEIGHT FIX */

function appHeight(){

    const vh = window.innerHeight;

    document.documentElement.style.height = vh + "px";

    document.body.style.height = vh + "px";

}

appHeight();

window.addEventListener("resize", appHeight);

window.addEventListener("orientationchange", appHeight);

/* FORCE GPU */

setTimeout(() => {

    frame.style.opacity = "0.99";

    setTimeout(() => {

        frame.style.opacity = "1";

    },50);

},1000);

/* VISIBILITY FIX */

document.addEventListener(
    "visibilitychange",
    () => {

        if(!document.hidden){

            const current = frame.src;

            frame.src = "";

            setTimeout(() => {

                frame.src = current;

            },100);

        }

    }
);

</script>

</body>
</html>
